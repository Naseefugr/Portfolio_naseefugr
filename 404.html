<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <title>404 - Page Not Found | Naseef Ugrapuram</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Poppins:wght@400;500;600&family=Quicksand:wght@600;700&display=swap"
    rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="64x64" href="image/favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="image/apple-touch-icon.png">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/style.css">

  <style>
    .error-page-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 60px 20px;
      background: linear-gradient(135deg, #ffffff 0%, #f4f9f6 100%);
    }

    .error-code {
      font-size: clamp(80px, 15vw, 150px);
      font-weight: 900;
      font-family: var(--font-logo);
      color: var(--primary);
      line-height: 1;
      margin-bottom: 15px;
      letter-spacing: -2px;
      text-shadow: 0 10px 25px rgba(44, 164, 109, 0.2);
    }

    .error-title {
      font-size: clamp(24px, 4vw, 36px);
      font-family: var(--font-heading);
      color: var(--dark);
      margin-bottom: 15px;
      font-weight: 700;
    }

    .error-desc {
      max-width: 520px;
      margin: 0 auto 30px;
      color: var(--text-muted);
      font-size: 16px;
      line-height: 1.6;
    }

    .error-actions {
      display: flex;
      gap: 15px;
      justify-content: center;
      flex-wrap: wrap;
    }
  </style>
</head>

<body>
  <div class="error-page-wrapper">
    <a href="https://www.naseefugr.online/" class="site-logo" style="margin-bottom: 40px;">
      <span class="logo-text">Naseef<span> Ugrapuram</span></span>
    </a>

    <div class="error-code">404</div>
    <h1 class="error-title">Page Not Found</h1>
    <p class="error-desc">
      The page you are looking for might have been removed, had its name changed, or is temporarily unavailable. Let's get you back on track.
    </p>

    <div class="error-actions">
      <a href="https://www.naseefugr.online/" class="btn btn-primary">
        <i class="fa fa-home"></i> Back to Homepage
      </a>
      <a href="https://www.naseefugr.online/#contact" class="btn btn-primary" style="background: var(--dark);">
        <i class="fa fa-envelope"></i> Contact Me
      </a>
    </div>
  </div>
</body>

</html>
